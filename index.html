<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ムシャーナドリームダービー</title>
<meta name="description" content="ポケモンスリープの「ゆめのかけらゲットS」のスクショを読み込むだけで、ゆめのかけらの量を週ごとの表に自動で記録するツール。" />
<!-- 自分用のページなので、Google などの検索結果に出さない -->
<meta name="robots" content="noindex, nofollow" />
<link rel="canonical" href="https://akirahaan-blip.github.io/pksl.dream-counter/" />
<link rel="icon" href="icon-192.png" />
<!-- スマホの「ホーム画面に追加」で出るアイコン -->
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="apple-mobile-web-app-title" content="ドリームダービー" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#c43d74" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@700;800&display=swap" rel="stylesheet">
<style>
/* ===== 色の設定（明るい画面） ===== */
:root{
  --bg:#fff5f9;        /* 背景の桜白 */
  --card:#ffffff;      /* カードの白 */
  --ink:#3d1b2c;       /* 文字色（濃いプラム） */
  --sub:#8e5a75;       /* 補足文字 */
  --accent:#c43d74;    /* 濃いピンク */
  --accent-w:#ffe1ee;  /* 薄いピンク */
  --line:#f3c6da;      /* 枠線 */
  --cell:#fbeaf2;      /* 表のマス（数字なし） */
  --head:#e9b7cf;      /* 表の見出し */
  --ok:#2b7f47;        /* 成功＝緑（意味を持つ色なので変えない） */
  --warn:#b8770a;      /* 注意＝橙 */
  --danger:#c0392b;    /* 失敗＝赤 */
}
/* ===== 色の設定（暗い画面） ===== */
@media (prefers-color-scheme: dark){
  :root{
    --bg:#2b0a1e; --card:#3b1530; --ink:#ffe6f1; --sub:#e0a5c3;
    --accent:#ff8ec4; --accent-w:#4d1f3a; --line:#6a2f52;
    --cell:#35122a; --head:#5a2646;
    --ok:#6ed693; --warn:#ffc861; --danger:#ff7b7b;
  }
}

/* ===== 文字まわり ===== */
html,body{
  font-family:"M PLUS 1p",-apple-system,"Segoe UI",sans-serif;
  font-weight:800;              /* 基本は Heavy。子要素は受け継ぐ */
}
h1,h2,h3,b,strong,button,input,select,textarea,th{font-weight:inherit}
/* 13.5px より小さい文字は Bold(700) に落として、つぶれを防ぐ */
.small,.note,.weeklabel,.hint,.thumb-info,.tbl td,.tbl th,.memo,.chip{font-size:12.5px;font-weight:700}

*{box-sizing:border-box}
body{
  margin:0; padding:16px 14px 60px;
  background:var(--bg); color:var(--ink);
  line-height:1.7; font-size:14px;
}

/* ===== 画像プレビューの窓 ===== */
.modal{position:fixed;inset:0;z-index:50;background:rgba(43,10,30,.6);display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal .box{background:var(--card);border-radius:14px;padding:14px;max-width:100%;max-height:100%;overflow:auto}
.modal img{max-width:100%;height:auto;border:2px solid var(--line);border-radius:8px;display:block}
.modal .btnrow{margin-top:10px}
.wrap{max-width:1000px;margin:0 auto}

/* ===== タイトル ===== */
header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
header img{width:110px;height:auto;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.15))}
/* タイトルはロゴ風：ピンクのグラデーションの帯に白抜き文字、まわりにキラキラ */
.kicker{
  display:inline-block;font-size:12.5px;font-weight:700;color:var(--accent);
  background:var(--accent-w);border-radius:999px;padding:1px 12px;margin-bottom:6px;
}
h1{position:relative;display:inline-block;max-width:100%;margin:0 0 6px;padding:0 10px}
#title{                       /* id で指定して、下の input[type=text] の見た目より優先させる */
  font-family:inherit;font-weight:inherit;font-size:26px;line-height:1.3;color:#fff;text-align:center;
  background:linear-gradient(135deg,#ff8ec4 0%,#e05a97 55%,#c43d74 100%);
  border:3px solid #fff;border-radius:999px;padding:6px 22px;
  box-shadow:0 4px 0 #9d2d5c,0 8px 16px rgba(196,61,116,.35);
  text-shadow:0 2px 0 rgba(120,20,70,.35);letter-spacing:.04em;
  width:auto;max-width:100%;
}
#title:focus{outline:none;border-color:#ffe066}
/* 左上と右下のキラキラ */
h1::before,h1::after{
  content:"✦";position:absolute;color:#ffd23f;pointer-events:none;
  text-shadow:0 0 6px rgba(255,210,63,.8);
}
h1::before{left:-6px;top:-10px;font-size:22px}
h1::after{right:-4px;bottom:-8px;font-size:16px}
@media (prefers-color-scheme: dark){
  #title{border-color:#ffd5e6;box-shadow:0 4px 0 #6a1f43,0 8px 16px rgba(0,0,0,.4)}
}

.panel{
  background:var(--card); border:2px solid var(--line);
  border-radius:14px; padding:14px; margin-bottom:16px;
}
.panel > h2{
  font-size:15px; margin:0 0 12px; color:var(--accent);
  border-bottom:2px dashed var(--line); padding-bottom:6px;
}
.note{color:var(--sub);margin:8px 0 0}

/* ===== 入力部品 ===== */
input[type=text],input[type=number],input[type=date],select,textarea{
  font-family:inherit;font-weight:inherit;font-size:14px;
  color:var(--ink); background:var(--bg);
  border:2px solid var(--line); border-radius:8px;
  padding:6px 8px;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=number]{width:110px}
textarea{width:100%;min-height:56px;resize:vertical}

/* ===== ボタン ===== */
button{
  font-family:inherit;font-size:14px;cursor:pointer;
  border:none;border-radius:10px;padding:9px 14px;
  background:var(--accent); color:#fff;
}
button:hover{filter:brightness(1.08)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.5;cursor:default}
button.mini{font-size:12.5px;font-weight:700;padding:5px 10px;background:var(--accent-w);color:var(--accent)}
button.danger,button.mini.danger{background:var(--danger);color:#fff}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ===== スクショを入れる場所 ===== */
.drop{
  display:block;
  border:3px dashed var(--line); border-radius:14px;
  padding:22px 14px; text-align:center; background:var(--bg);
  cursor:pointer; transition:.15s;
}
.drop.over{border-color:var(--accent);background:var(--accent-w)}
.drop .big{font-size:16px;color:var(--accent)}
.drop input{display:none}
.hint{color:var(--sub);margin-top:4px}
.status{margin-top:10px;color:var(--sub)}
.status.ok{color:var(--ok)}
.status.err{color:var(--danger)}

/* ===== 読み取り結果の一覧 ===== */
.results{display:grid;gap:10px;margin-top:12px}
.res{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg);
}
.res img{width:54px;height:54px;object-fit:cover;object-position:bottom;border-radius:8px;flex:none}
.res .thumb-info{color:var(--sub);min-width:70px}
.res.fail{border-color:var(--warn)}
.res.done{opacity:.55}
.res .val{display:flex;align-items:center;gap:6px}
.res .val span{color:var(--sub)}
.chip{padding:2px 8px;border-radius:999px;background:var(--accent-w);color:var(--accent)}
.chip.warn{background:#fff1d6;color:var(--warn)}
@media (prefers-color-scheme: dark){ .chip.warn{background:#4d3a12} }

/* ===== 週の切りかえ ===== */
.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.weeklabel{color:var(--sub);flex:1}

/* ===== 表 ===== */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:2px solid var(--line)}
.tbl{border-collapse:collapse;min-width:100%;white-space:nowrap}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 7px;text-align:right;min-width:52px}
.tbl th{background:var(--head);color:var(--ink);text-align:center}
.tbl th.day,.tbl td.day{
  text-align:center;position:sticky;left:0;background:var(--head);
  min-width:64px;z-index:1;
}
.tbl td.day{background:var(--accent-w)}
.tbl td.num{background:var(--card);cursor:pointer}
.tbl td.num:hover{background:var(--accent-w)}
.tbl td.empty{background:var(--cell)}
.tbl td.sum,.tbl th.sum{background:var(--accent-w);color:var(--accent)}
.tbl tr.total td{background:var(--head);color:var(--ink)}
.tbl tr.today td.day{outline:2px solid var(--accent);outline-offset:-2px}
/* ===== キャンプチケット・フィールドのチェック ===== */
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:12px}
.opts .chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px}
.opts .lbl{color:var(--sub)}
.memo{margin-top:10px}
.memo label{display:block;color:var(--sub);margin-bottom:4px}

/* ===== ざっくりの週まとめ ===== */
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.stat{background:var(--accent-w);border-radius:10px;padding:6px 12px;min-width:110px}
.stat .k{font-size:12.5px;font-weight:700;color:var(--sub)}
.stat .v{font-size:18px;color:var(--accent)}

@media (max-width:520px){
  /* スマホでは絵を上、タイトルを下に縦に並べて、帯を横いっぱいに使う */
  header{flex-direction:column;align-items:center;text-align:center;gap:4px}
  header img{width:96px}
  header > div{width:100%}
  h1{display:block;padding:0 8px}
  #title{font-size:19px;padding:5px 12px;width:100% !important}
  h1::before{font-size:18px;top:-9px;left:-2px}
  h1::after{right:-2px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <img src="musharna.png" alt="ムシャーナのイラスト">
  <div style="flex:1;min-width:0">
    <div class="kicker">✨ ゆめのかけら きろくちょう ✨</div>
    <h1><input id="title" type="text" value="ムシャーナドリームダービー" aria-label="表のタイトル（タップで書きかえ）" title="タップして書きかえられます"></h1>
  </div>
</header>

<!-- ===== 1. スクショを読み込む ===== -->
<section class="panel">
  <h2>1. スクショを読み込む</h2>
  <label class="drop" id="drop">
    <div class="big">ここにスクショをドラッグ＆ドロップ／タップして選ぶ</div>
    <div class="hint">「ゆめのかけら x3,546をゲット！」の吹き出しが写っているスクショ。まとめて何枚でもOK。</div>
    <input id="file" type="file" accept="image/*" multiple>
  </label>
  <div class="status" id="status">読み取りの準備をしています…（初回だけ少し時間がかかります）</div>

  <div class="btnrow" style="margin-top:12px">
    <span class="small" style="color:var(--sub)">記録する日付：</span>
    <input type="date" id="date">
    <button class="mini" id="todayBtn">今日にする</button>
  </div>

  <div class="results" id="results"></div>
  <div class="btnrow" style="margin-top:10px">
    <button id="addAll" disabled>読み取れた分をまとめて表に追加</button>
    <button class="mini" id="clearRes">読み取り結果を消す</button>
  </div>

  <p class="note">手で入れる場合はこちら：
    <input type="number" id="manual" placeholder="例 3546" min="0">
    <button class="mini" id="manualAdd">追加</button>
  </p>
</section>

<!-- ===== 2. 週の表 ===== -->
<section class="panel">
  <h2>2. 週の表</h2>
  <div class="weeknav">
    <button class="mini" id="prevW">◀ 前の週</button>
    <div class="weeklabel" id="weeklabel"></div>
    <button class="mini" id="nextW">次の週 ▶</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="k">週の合計</div><div class="v" id="sTotal">0</div></div>
    <div class="stat"><div class="k">発動回数</div><div class="v" id="sCount">0</div></div>
    <div class="stat"><div class="k">1回の平均</div><div class="v" id="sAvg">-</div></div>
  </div>

  <div class="tblwrap"><table class="tbl" id="tbl"></table></div>
  <p class="note">数字のマスをタップすると、直したり消したりできます。</p>

  <!-- キャンプチケットとフィールドは別の行に分ける（スマホで横に並ぶと見づらいため） -->
  <div class="opts">
    <label class="chk"><input type="checkbox" id="camp"> キャンプチケットあり</label>
  </div>
  <div class="opts" style="margin-top:6px">
    <span class="small lbl">フィールド：</span>
    <label class="chk"><input type="checkbox" id="fieldW" data-field="ワカクサ"> ワカクサ</label>
    <label class="chk"><input type="checkbox" id="fieldEX" data-field="ワカクサEX"> ワカクサEX</label>
  </div>
  <p class="note">チェックした内容は「表を画像で保存」の画像の右上に出ます。</p>

  <div class="memo">
    <label for="memo">メモ（自由に）</label>
    <textarea id="memo" placeholder="この週のメモ"></textarea>
  </div>

  <div class="btnrow" style="margin-top:12px">
    <button class="mini" id="undo">1つ戻す</button>
    <button id="saveImg">表を画像で保存</button>
    <button class="mini" id="copyTsv">表をコピー（スプレッドシート貼り付け用）</button>
    <button class="mini danger" id="resetW">この週を全部消す</button>
  </div>
</section>

</div>

<!-- 「表を画像で保存」を押したときに出る窓 -->
<div class="modal" id="imgModal">
  <div class="box">
    <img id="imgOut" alt="表の画像">
    <p class="note">スマホの場合は、画像を長押しして「写真に保存」でも保存できます。</p>
    <div class="btnrow">
      <a id="imgDl" download><button>ダウンロード</button></a>
      <button class="mini" id="imgClose">閉じる</button>
    </div>
  </div>
</div>

<!-- OCR（画像の中の文字を読み取るライブラリ）。ブラウザの中だけで動く -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
/* =========================================================
   設定
   ========================================================= */
const BASE_DATE = '2026-09-21';   // 第1週の月曜日。これより前の週は作らない
const MIN_COLS  = 7;              // 表に最低いくつ列を出すか（これより多い日があれば自動で増える）
const STORE_KEY = 'dreamDerby.v1';
const DOW = ['月','火','水','木','金','土','日'];

/* =========================================================
   日付のヘルパー
   ========================================================= */
// 'YYYY-MM-DD' ←→ Date（時差でズレないよう、時刻は正午にしておく）
const toDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const toKey  = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (s, n) => { const d = toDate(s); d.setDate(d.getDate()+n); return toKey(d); };
const todayKey = () => toKey(new Date());
// その日が入る週の月曜日
function mondayOf(s){
  const d = toDate(s);
  const back = (d.getDay() + 6) % 7;   // 月=0 … 日=6
  d.setDate(d.getDate() - back);
  return toKey(d);
}
const fmtMD = s => { const d = toDate(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const weekNo = mon => Math.round((toDate(mon) - toDate(BASE_DATE)) / 864e5 / 7) + 1;
const fmtNum = n => n.toLocaleString('ja-JP');

/* =========================================================
   保存データ
   data = { title, weeks: { '2026-09-21': { memo:'', days: { '2026-09-21':[3546,…], … } } } }
   ========================================================= */
let data = load();
function load(){
  try{ const j = JSON.parse(localStorage.getItem(STORE_KEY)); if (j && j.weeks) return j; }catch(e){}
  return { title:'ムシャーナドリームダービー', weeks:{} };
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
function week(mon){ return data.weeks[mon] || (data.weeks[mon] = { memo:'', days:{} }); }

let curMon = mondayOf(todayKey() < BASE_DATE ? BASE_DATE : todayKey());   // いま表示している週
const undoStack = [];   // 「1つ戻す」用。直前の data のコピーを積む
function snapshot(){ undoStack.push(JSON.stringify(data)); if (undoStack.length > 30) undoStack.shift(); }

/* =========================================================
   画面の部品
   ========================================================= */
const $ = id => document.getElementById(id);
const dateEl = $('date'), statusEl = $('status'), resultsEl = $('results'), addAllBtn = $('addAll');

$('title').value = data.title;
// 帯の幅を文字数に合わせる（日本語1文字≒1em）
function fitTitle(){ const el = $('title'); el.style.width = `calc(${Math.max(4, [...el.value].length) * 1.1}em + 72px)`; }
fitTitle();
$('title').addEventListener('input', e => { data.title = e.target.value; document.title = data.title || 'ドリームダービー'; fitTitle(); save(); });
document.title = data.title;

function setDefaultDate(){ const t = todayKey(); dateEl.value = t < BASE_DATE ? BASE_DATE : t; }
dateEl.min = BASE_DATE;
setDefaultDate();
$('todayBtn').onclick = setDefaultDate;

/* ---------- 記録を1件足す ---------- */
function addEntry(value, dateKey){
  if (!dateKey || dateKey < BASE_DATE){ alert(`日付は ${fmtMD(BASE_DATE)} 以降にしてください。`); return false; }
  snapshot();
  const w = week(mondayOf(dateKey));
  (w.days[dateKey] || (w.days[dateKey] = [])).push(value);
  save();
  curMon = mondayOf(dateKey);
  render();
  return true;
}

/* ---------- 手入力 ---------- */
$('manualAdd').onclick = () => {
  const v = parseInt($('manual').value, 10);
  if (!(v > 0)){ alert('数字を入れてください。'); return; }
  if (addEntry(v, dateEl.value)) $('manual').value = '';
};

/* =========================================================
   OCR（読み取り）
   ========================================================= */
let worker = null, workerReady = null;
function getWorker(){
  if (!workerReady){
    workerReady = (async () => {
      if (typeof Tesseract === 'undefined') throw new Error('読み取りライブラリが読み込めませんでした。ネットにつながっているか確認してください。');
      worker = await Tesseract.createWorker('eng');
      return worker;
    })();
    workerReady.then(() => setStatus('', ''))   // 準備できたら文字は消す（準備中・読み取り中・エラーのときだけ出す）
               .catch(e => { setStatus(e.message, 'err'); workerReady = null; });
  }
  return workerReady;
}
function setStatus(msg, cls){ statusEl.textContent = msg; statusEl.className = 'status ' + (cls||''); }
getWorker();   // ページを開いた時点で準備を始めておく

// 画像ファイル → <img>
function loadImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('画像が開けませんでした'));
    img.src = url;
  });
}

// 下ごしらえ：画像の下側だけ切り出し → 拡大 → 白黒にする（吹き出しの文字がはっきりする）
function preprocess(img, fromRatio){
  const top = Math.floor(img.naturalHeight * fromRatio);
  const h = img.naturalHeight - top;
  const scale = Math.min(2, 2200 / img.naturalWidth);
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * scale);
  c.height = Math.round(h * scale);
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, top, img.naturalWidth, h, 0, 0, c.width, c.height);
  const im = ctx.getImageData(0, 0, c.width, c.height), p = im.data;
  for (let i = 0; i < p.length; i += 4){
    const l = (p[i]*0.299 + p[i+1]*0.587 + p[i+2]*0.114);
    const v = l > 150 ? 255 : 0;
    p[i] = p[i+1] = p[i+2] = v;
  }
  ctx.putImageData(im, 0, 0);
  return c;
}

// OCR の結果テキストから「x3,546」の数字部分を取り出す
const WHITELIST = '0123456789,xX×';   // 1回目は「数字・カンマ・x」だけを探させる
const longest = arr => arr.sort((a,b) => b.length - a.length)[0];

// 1回目の結果から「x3,546」のようなカンマ付きの数を取り出す（ゲームは1,000以上には必ずカンマを付ける）
function pickComma(text){
  const m = text.match(/[xX×] *(\d{1,3}(?:,\d{3})+)/);
  return m ? parseInt(m[1].replace(/,/g,''), 10) : null;
}
// カンマなしの数字の並び（x の後ろ）を全部集めて、いちばん長いものを採用（「X1」のようなゴミを避ける）
function pickNoComma(text){
  const all = [...text.matchAll(/[xX×] *(\d{1,6})/g)].map(m => m[1]);
  return all.length ? longest(all) : null;
}

/* 1枚の下ごしらえ済み画像から数を読む。
   - カンマ付きで読めたら、それで確定
   - カンマなし（999以下）のときは、数字の後ろの「を」が 5 などに化けて
     末尾にくっつくことがある（例：340を → 3405）。そこで 2回目は文字の
     絞り込みなしで読み直し、数字が何けたあるかを確かめて、それに合わせて切る */
async function readNumber(w, canvas){
  await w.setParameters({ tessedit_char_whitelist: WHITELIST });
  const t1 = (await w.recognize(canvas)).data.text;
  const c = pickComma(t1);
  if (c !== null) return c;
  const d = pickNoComma(t1);
  if (d === null) return null;
  await w.setParameters({ tessedit_char_whitelist: '' });
  const t2 = (await w.recognize(canvas)).data.text;
  const cands = [...t2.matchAll(/[xX×] ?(\d{1,3})(?!\d)/g)].map(m => m[1]).filter(r => d.startsWith(r));
  if (cands.length) return parseInt(longest(cands), 10);
  return parseInt(d.slice(0, 3), 10);   // 2回目で分からなければ、先頭3けたまでにする
}

async function recognizeFile(file){
  const w = await getWorker();
  const img = await loadImage(file);
  // まず下 45% を読む。ダメなら下 70%、それでもダメなら全体
  for (const r of [0.55, 0.30, 0]){
    const n = await readNumber(w, preprocess(img, r));
    if (n !== null) return { value:n, img };
  }
  return { value:null, img };
}

/* ---------- ファイルを受け取る ---------- */
const results = [];   // { file, value, added, el }
async function handleFiles(files){
  const list = [...files].filter(f => f.type.startsWith('image/'));
  if (!list.length) return;
  try{ await getWorker(); }catch(e){ setStatus(e.message, 'err'); return; }
  let i = 0;
  for (const file of list){
    i++;
    setStatus(`読み取り中… ${i} / ${list.length} 枚目`);
    const row = { file, value:null, added:false, el:null };
    results.push(row);
    row.el = renderResult(row, '読み取り中…');
    try{
      const r = await recognizeFile(file);
      row.value = r.value;
      row.thumb = r.img.src;
    }catch(e){ row.err = e.message; }
    renderResult(row);
  }
  const okN = results.filter(r => r.value !== null && !r.added).length;
  setStatus(okN ? `読み取り完了。数字を確認して「表に追加」を押してください。` : '数字が見つかりませんでした。手で入れてください。', okN ? 'ok' : 'err');
  updateAddAll();
}

function renderResult(row, msg){
  const el = row.el || document.createElement('div');
  el.className = 'res' + (row.value === null && !msg ? ' fail' : '') + (row.added ? ' done' : '');
  el.innerHTML = '';
  if (row.thumb){ const im = document.createElement('img'); im.src = row.thumb; el.appendChild(im); }
  const info = document.createElement('div'); info.className = 'thumb-info';
  info.textContent = row.file.name.length > 18 ? row.file.name.slice(0,16)+'…' : row.file.name;
  el.appendChild(info);
  if (msg){ const s = document.createElement('span'); s.className='chip'; s.textContent = msg; el.appendChild(s); }
  else{
    const val = document.createElement('div'); val.className = 'val';
    const inp = document.createElement('input'); inp.type='number'; inp.min='0';
    inp.value = row.value ?? '';
    inp.placeholder = '読めず';
    inp.oninput = () => { row.value = inp.value ? parseInt(inp.value,10) : null; updateAddAll(); };
    val.appendChild(document.createTextNode('ゆめのかけら ×'));
    val.appendChild(inp);
    el.appendChild(val);
    const chip = document.createElement('span');
    if (row.added){ chip.className='chip'; chip.textContent='追加ずみ'; }
    else if (row.value === null){ chip.className='chip warn'; chip.textContent = row.err ? row.err : '読めませんでした。数字を打ってください'; }
    else { chip.className='chip'; chip.textContent='読み取りOK'; }
    el.appendChild(chip);
    if (!row.added){
      const b = document.createElement('button'); b.className='mini'; b.textContent='この1枚を表に追加';
      b.onclick = () => { if (row.value > 0 && addEntry(row.value, dateEl.value)){ row.added = true; renderResult(row); updateAddAll(); } else alert('数字を入れてください。'); };
      el.appendChild(b);
    }
  }
  if (!row.el) resultsEl.appendChild(el);
  row.el = el;
  return el;
}
function updateAddAll(){
  const n = results.filter(r => r.value > 0 && !r.added).length;
  addAllBtn.disabled = n === 0;
  addAllBtn.textContent = n ? `読み取れた ${n} 枚をまとめて表に追加` : '読み取れた分をまとめて表に追加';
}
addAllBtn.onclick = () => {
  const list = results.filter(r => r.value > 0 && !r.added);
  if (!list.length) return;
  snapshot();
  const w = week(mondayOf(dateEl.value)); const k = dateEl.value;
  if (k < BASE_DATE){ alert(`日付は ${fmtMD(BASE_DATE)} 以降にしてください。`); undoStack.pop(); return; }
  for (const r of list){ (w.days[k] || (w.days[k] = [])).push(r.value); r.added = true; renderResult(r); }
  save(); curMon = mondayOf(k); render(); updateAddAll();
};
$('clearRes').onclick = () => { results.length = 0; resultsEl.innerHTML=''; updateAddAll(); };

const drop = $('drop');
$('file').addEventListener('change', e => { handleFiles(e.target.files); e.target.value=''; });
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
// クリップボードの画像を Ctrl+V で貼り付けても読める
document.addEventListener('paste', e => {
  const fs = [...(e.clipboardData?.items || [])].filter(i => i.type.startsWith('image/')).map(i => i.getAsFile());
  if (fs.length) handleFiles(fs);
});

/* =========================================================
   表の描画
   ========================================================= */
function render(){
  const w = week(curMon);
  const days = Array.from({length:7}, (_,i) => addDays(curMon, i));
  const maxLen = Math.max(MIN_COLS, ...days.map(d => (w.days[d]||[]).length));
  const t = $('tbl'); t.innerHTML = '';

  // 見出し行
  const thead = t.createTHead().insertRow();
  const th0 = document.createElement('th'); th0.className='day'; th0.textContent='曜日'; thead.appendChild(th0);
  for (let i = 1; i <= maxLen; i++){ const th = document.createElement('th'); th.textContent = i; thead.appendChild(th); }
  for (const s of ['合計','発動回数','平均']){ const th = document.createElement('th'); th.className='sum'; th.textContent = s; thead.appendChild(th); }

  const tb = t.createTBody();
  let gTotal = 0, gCount = 0;
  const today = todayKey();
  days.forEach((d, i) => {
    const arr = w.days[d] || [];
    const tr = tb.insertRow(); if (d === today) tr.className = 'today';
    const td0 = tr.insertCell(); td0.className='day'; td0.innerHTML = `${DOW[i]}<br><span class="small" style="color:var(--sub)">${fmtMD(d)}</span>`;
    for (let c = 0; c < maxLen; c++){
      const td = tr.insertCell();
      if (c < arr.length){
        td.className='num'; td.textContent = fmtNum(arr[c]);
        td.title = 'タップして直す／消す';
        td.onclick = () => editCell(d, c);
      } else td.className='empty';
    }
    const total = arr.reduce((a,b)=>a+b, 0);
    gTotal += total; gCount += arr.length;
    tr.insertCell().className='sum'; tr.cells[tr.cells.length-1].textContent = arr.length ? fmtNum(total) : '';
    tr.insertCell().className='sum'; tr.cells[tr.cells.length-1].textContent = arr.length || '';
    tr.insertCell().className='sum'; tr.cells[tr.cells.length-1].textContent = arr.length ? fmtNum(Math.round(total/arr.length*100)/100) : '';
  });
  // 週の合計行
  const tr = tb.insertRow(); tr.className='total';
  const td0 = tr.insertCell(); td0.className='day'; td0.textContent='週計';
  const tdSpan = tr.insertCell(); tdSpan.colSpan = maxLen; tdSpan.textContent='';
  tr.insertCell().textContent = gCount ? fmtNum(gTotal) : '';
  tr.insertCell().textContent = gCount || '';
  tr.insertCell().textContent = gCount ? fmtNum(Math.round(gTotal/gCount*100)/100) : '';

  $('sTotal').textContent = fmtNum(gTotal);
  $('sCount').textContent = gCount;
  $('sAvg').textContent = gCount ? fmtNum(Math.round(gTotal/gCount*100)/100) : '-';

  $('weeklabel').textContent = `第${weekNo(curMon)}週　${fmtMD(curMon)}(月) 〜 ${fmtMD(addDays(curMon,6))}(日)`;
  $('prevW').disabled = curMon <= BASE_DATE;
  $('memo').value = w.memo || '';
  $('camp').checked = !!w.camp;
  $('fieldW').checked = w.field === 'ワカクサ';
  $('fieldEX').checked = w.field === 'ワカクサEX';
  $('undo').disabled = undoStack.length === 0;
}

function editCell(d, idx){
  const w = week(curMon); const arr = w.days[d];
  const cur = arr[idx];
  const s = prompt(`${fmtMD(d)} の ${idx+1} 回目：${fmtNum(cur)}\n数字を直すか、空にして OK を押すと消えます。`, cur);
  if (s === null) return;
  snapshot();
  const v = parseInt(String(s).replace(/[^\d]/g,''), 10);
  if (v > 0) arr[idx] = v; else arr.splice(idx, 1);
  if (!arr.length) delete w.days[d];
  save(); render();
}

$('memo').addEventListener('input', e => { week(curMon).memo = e.target.value; save(); });
$('camp').addEventListener('change', e => { week(curMon).camp = e.target.checked; save(); });
// フィールドはどちらか片方だけ。片方をチェックすると、もう片方は外れる
[$('fieldW'), $('fieldEX')].forEach(cb => cb.addEventListener('change', e => {
  week(curMon).field = e.target.checked ? e.target.dataset.field : '';
  save(); render();
}));
$('prevW').onclick = () => { curMon = addDays(curMon, -7); render(); };
$('nextW').onclick = () => { curMon = addDays(curMon, 7); render(); };
$('undo').onclick = () => { if (!undoStack.length) return; data = JSON.parse(undoStack.pop()); save(); render(); };
$('resetW').onclick = () => {
  if (!confirm(`第${weekNo(curMon)}週の記録を全部消します。よろしいですか？（「1つ戻す」で戻せます）`)) return;
  snapshot(); data.weeks[curMon] = { memo:'', days:{} }; save(); render();
};

// スプレッドシートに貼れる形（タブ区切り）でコピー
$('copyTsv').onclick = async () => {
  const w = week(curMon);
  const days = Array.from({length:7}, (_,i) => addDays(curMon, i));
  const maxLen = Math.max(MIN_COLS, ...days.map(d => (w.days[d]||[]).length));
  const rows = [[data.title], ['', ...Array.from({length:maxLen},(_,i)=>i+1), '合計','発動回数','平均']];
  let gT=0,gC=0;
  days.forEach((d,i)=>{
    const arr = w.days[d]||[]; const t = arr.reduce((a,b)=>a+b,0); gT+=t; gC+=arr.length;
    const cells = Array.from({length:maxLen},(_,c)=> c<arr.length ? arr[c] : '');
    rows.push([DOW[i], ...cells, arr.length?t:'', arr.length||'', arr.length?Math.round(t/arr.length*100)/100:'']);
  });
  const tags = [w.field||'', w.camp?'キャンプチケットあり':'', w.memo||''].filter(Boolean).join(' / ');
  rows.push([tags, ...Array(maxLen).fill(''), gC?gT:'', gC||'', gC?Math.round(gT/gC*100)/100:'']);
  const tsv = rows.map(r=>r.join('\t')).join('\n');
  try{ await navigator.clipboard.writeText(tsv); alert('コピーしました。スプレッドシートの左上のマスを選んで貼り付けてください。'); }
  catch(e){ prompt('コピーできませんでした。この中身を手でコピーしてください。', tsv); }
};

function loadImg(src){ return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }

async function drawTableImage(){
  const w = week(curMon);
  const days = Array.from({length:7}, (_,i) => addDays(curMon, i));
  const maxLen = Math.max(MIN_COLS, ...days.map(d => (w.days[d]||[]).length));

  // ---- 大きさを決める ----
  const PAD = 40, DAYW = 96, COLW = 104, SUMW = 118, ROWH = 46, HEADH = 44;
  const W = PAD*2 + DAYW + COLW*maxLen + SUMW*3;
  const TOP = 150;                              // 表が始まる高さ（上にタイトル）
  const H = TOP + HEADH + ROWH*8 + 90;          // 7日＋週計の行、下にまとめ
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const font = (px, weight=800) => `${weight} ${px}px "M PLUS 1p", sans-serif`;
  try{ await document.fonts.load(font(20)); await document.fonts.load(font(14,700)); }catch(e){}

  // ---- 背景（桜白）と薄いムシャーナ ----
  ctx.fillStyle = '#fff5f9'; ctx.fillRect(0,0,W,H);
  // 表の後ろにムシャーナを大きく置く（マスは半透明なので、顔が透けて見える）
  try{
    const im = await loadImg(MUSHARNA_DATA);
    const tableH = HEADH + ROWH*8;
    const mh = tableH * 1.15, mw = mh * im.width / im.height;
    ctx.globalAlpha = 0.28;
    ctx.drawImage(im, (W - mw)/2, TOP + tableH/2 - mh/2, mw, mh);
    ctx.globalAlpha = 1;
  }catch(e){}

  // ---- タイトル（ピンクの帯に白文字） ----
  ctx.textBaseline = 'middle';
  ctx.font = font(30);
  const title = data.title || 'ドリームダービー';
  const tw = ctx.measureText(title).width + 64;
  const g = ctx.createLinearGradient(PAD, 0, PAD+tw, 0);
  g.addColorStop(0,'#ff8ec4'); g.addColorStop(0.55,'#e05a97'); g.addColorStop(1,'#c43d74');
  ctx.fillStyle = '#9d2d5c'; ctx.beginPath(); ctx.roundRect(PAD, 34, tw, 60, 30); ctx.fill();   // 下の影
  ctx.fillStyle = g;          ctx.beginPath(); ctx.roundRect(PAD, 30, tw, 60, 30); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = 'rgba(120,20,70,.35)'; ctx.fillText(title, PAD+32, 62);
  ctx.fillStyle = '#fff'; ctx.fillText(title, PAD+32, 60);
  ctx.fillStyle = '#ffd23f'; ctx.font = font(22); ctx.fillText('✦', PAD-14, 30); ctx.font = font(16); ctx.fillText('✦', PAD+tw-2, 92);
  // 週のラベル
  ctx.fillStyle = '#8e5a75'; ctx.font = font(16,700);
  ctx.fillText(`第${weekNo(curMon)}週　${fmtMD(curMon)}(月) 〜 ${fmtMD(addDays(curMon,6))}(日)`, PAD+tw+20, 60);

  // ---- 右上のバッジ：フィールド名（色つき）と、キャンプチケットあり（白ぬき） ----
  {
    const badges = [];
    if (w.field) badges.push({ text: w.field, fill: '#c43d74', ink: '#fff' });
    if (w.camp)  badges.push({ text: 'キャンプチケットあり', fill: '#fff', ink: '#c43d74' });
    ctx.font = font(17); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let bx = W - PAD;                                   // 右端から左へ並べていく
    for (const b of badges.reverse()){
      const bw = ctx.measureText(b.text).width + 36, bh = 40;
      bx -= bw;
      ctx.fillStyle = b.fill; ctx.beginPath(); ctx.roundRect(bx, 40, bw, bh, 20); ctx.fill();
      ctx.strokeStyle = '#c43d74'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = b.ink; ctx.fillText(b.text, bx + bw/2, 60 + 1);
      bx -= 12;
    }
    ctx.textAlign = 'left';
  }

  // ---- 表 ----
  const colX = i => PAD + DAYW + COLW*i;                 // i 列目（0始まり）の左端
  const sumX = i => PAD + DAYW + COLW*maxLen + SUMW*i;   // 合計・回数・平均
  const cell = (x, y, wd, ht, bg, text, color, align='right', f=font(17)) => {
    ctx.fillStyle = bg; ctx.fillRect(x, y, wd, ht);
    ctx.strokeStyle = '#f3c6da'; ctx.lineWidth = 1; ctx.strokeRect(x+.5, y+.5, wd-1, ht-1);
    if (text === '' || text == null) return;
    ctx.fillStyle = color; ctx.font = f; ctx.textAlign = align;
    const tx = align === 'right' ? x + wd - 10 : align === 'left' ? x + 10 : x + wd/2;
    ctx.fillText(String(text), tx, y + ht/2 + 1);
  };
  // 見出し
  let y = TOP;
  cell(PAD, y, DAYW, HEADH, 'rgba(233,183,207,.75)', '曜日', '#3d1b2c', 'center', font(15,700));
  for (let i = 0; i < maxLen; i++) cell(colX(i), y, COLW, HEADH, 'rgba(233,183,207,.75)', i+1, '#3d1b2c', 'center', font(15,700));
  ['合計','発動回数','平均'].forEach((t,i) => cell(sumX(i), y, SUMW, HEADH, 'rgba(233,183,207,.75)', t, '#c43d74', 'center', font(15,700)));
  y += HEADH;
  let gT = 0, gC = 0;
  days.forEach((d, i) => {
    const arr = w.days[d] || [];
    const t = arr.reduce((a,b)=>a+b,0); gT += t; gC += arr.length;
    cell(PAD, y, DAYW, ROWH, 'rgba(255,225,238,.6)', `${DOW[i]} ${fmtMD(d)}`, '#3d1b2c', 'center', font(15,700));
    for (let cI = 0; cI < maxLen; cI++)
      cell(colX(cI), y, COLW, ROWH, cI < arr.length ? 'rgba(255,255,255,.55)' : 'rgba(251,234,242,.45)', cI < arr.length ? fmtNum(arr[cI]) : '', '#3d1b2c');
    cell(sumX(0), y, SUMW, ROWH, 'rgba(255,225,238,.6)', arr.length ? fmtNum(t) : '', '#c43d74');
    cell(sumX(1), y, SUMW, ROWH, 'rgba(255,225,238,.6)', arr.length || '', '#c43d74');
    cell(sumX(2), y, SUMW, ROWH, 'rgba(255,225,238,.6)', arr.length ? fmtNum(Math.round(t/arr.length*100)/100) : '', '#c43d74');
    y += ROWH;
  });
  // 週計の行（左の広いマスにはメモを書く）
  cell(PAD, y, DAYW, ROWH, 'rgba(233,183,207,.75)', '週計', '#3d1b2c', 'center', font(15,700));
  cell(colX(0), y, COLW*maxLen, ROWH, 'rgba(233,183,207,.75)', w.memo || '', '#3d1b2c', 'left', font(15,700));
  cell(sumX(0), y, SUMW, ROWH, 'rgba(233,183,207,.75)', gC ? fmtNum(gT) : '', '#3d1b2c');
  cell(sumX(1), y, SUMW, ROWH, 'rgba(233,183,207,.75)', gC || '', '#3d1b2c');
  cell(sumX(2), y, SUMW, ROWH, 'rgba(233,183,207,.75)', gC ? fmtNum(Math.round(gT/gC*100)/100) : '', '#3d1b2c');
  y += ROWH;

  // ---- 下のまとめ ----
  ctx.textAlign = 'left'; ctx.fillStyle = '#c43d74'; ctx.font = font(18);
  ctx.fillText(`週の合計 ${fmtNum(gT)}　／　発動 ${gC} 回　／　1回の平均 ${gC ? fmtNum(Math.round(gT/gC*100)/100) : '-'}`, PAD, y + 40);
  return c;
}

$('saveImg').onclick = async () => {
  try{
    const c = await drawTableImage();
    const url = c.toDataURL('image/png');
    $('imgOut').src = url;
    const a = $('imgDl'); a.href = url;
    a.download = `${data.title || 'ドリームダービー'}_第${weekNo(curMon)}週_${fmtMD(curMon).replace('/','')}-${fmtMD(addDays(curMon,6)).replace('/','')}.png`;
    $('imgModal').classList.add('show');
  }catch(e){ alert('画像を作れませんでした：' + e.message); }
};
$('imgClose').onclick = () => $('imgModal').classList.remove('show');
$('imgModal').addEventListener('click', e => { if (e.target === $('imgModal')) $('imgModal').classList.remove('show'); });

render();
</script>
